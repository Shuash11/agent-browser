[package]
name = "agent-browser"
version = "0.1.0"
edition = "2021"
description = "Local browser panel controlled by OpenCode over MCP (personal use)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.3"
wry = "0.57.3"
enigo = "0.6.1"
screenshots = "0.8.7"
rmcp = { version = "3.11.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
tokio = { version = "1.54.1", features = ["full"] }
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
portable-pty = "0.9.0"

[dev-dependencies]
