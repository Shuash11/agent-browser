<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCode terminal</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="xterm.min.css">
<style>
  html, body { overflow: hidden; }
  #bar { height:36px; display:flex; align-items:center; gap:var(--space-2);
         padding:0 var(--space-3); background:var(--surface); border-bottom:1px solid var(--line); }
  #bar strong { color:var(--accent); font-size:11px; font-weight:600;
                letter-spacing:.08em; text-transform:uppercase; }
  #bar .sub { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden;
              text-overflow:ellipsis; }
  #dock { margin-left:auto; min-height:24px; padding:2px 10px; font-size:11px; }
  #term { position:absolute; top:36px; left:0; right:0; bottom:0; padding:var(--space-2); }
  #term .xterm { padding:4px; }
</style>
</head>
<body>
<div id="bar">
  <strong>OpenCode</strong>
  <span class="sub">embedded session · local PTY</span>
  <button id="update" aria-label="Check for updates">Check for updates</button>
  <button id="dock" aria-label="Toggle terminal dock position">Dock: Left</button>
</div>
<div id="term"></div>
<script>
  window.__setDock = function (mode) {
    document.getElementById('dock').textContent =
      'Dock: ' + (mode === 'bottom' ? 'Bottom' : 'Left');
  };
  document.getElementById('dock').addEventListener('click', function () {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'dock' }));
  });
  document.getElementById('update').addEventListener('click', function () {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'update_check' }));
  });
  window.onerror = function (m) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'jserror', message: String(m) }));
  };
</script>
<script src="xterm.min.js"></script>
<script src="addon-fit.min.js"></script>
<script>
  const term = new Terminal({
    fontFamily: '"Cascadia Mono", "JetBrains Mono", Consolas, monospace',
    fontSize: 13,
    lineHeight: 1.3,
    cursorBlink: true,
    theme: {
      background: '#0b1120', foreground: '#e8edf6', cursor: '#4dd8ff',
      selectionBackground: 'rgba(77,216,255,0.24)',
      black: '#0b1120', brightBlack: '#9aabc4'
    }
  });
  term.open(document.getElementById('term'));
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  fitAddon.fit();
  term.focus();

  function sendSize() {
    window.chrome.webview.postMessage(JSON.stringify({
      type: 'resize', cols: term.cols, rows: term.rows
    }));
  }
  window.__fit = function () { fitAddon.fit(); sendSize(); };
  window.addEventListener('resize', function () { fitAddon.fit(); sendSize(); });
  term.onData(function (data) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'input', data: data }));
  });
  sendSize();
  window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
  window.__termWrite = function (data) { term.write(data); };
</script>
</body>
</html>
