<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCode terminal</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="xterm.min.css">
<style>
  html, body { overflow: hidden; }
  #bar { height:36px; display:flex; align-items:center; gap:var(--space-2);
         padding:0 var(--space-3); background:var(--surface);
         border-bottom:1px solid var(--line); }
  .traffic { display:flex; gap:6px; margin-right:var(--space-1); }
  .traffic button { width:12px; height:12px; min-width:12px; padding:0; border:0;
                    border-radius:50%; font-size:0; line-height:12px; }
  .traffic button:hover { font-size:9px; color:#1e1e1e; }
  .traffic .close { background:#ff5f57; }
  .traffic .min { background:#febc2e; }
  .traffic .max { background:#28c840; }
  #bar strong { color:var(--accent); font-size:11px; font-weight:600; }
  #bar .sub { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden;
              text-overflow:ellipsis; }
  #dock, #update, #modelToggle { min-height:24px; padding:2px 8px; font-size:11px; }
  #modelToggle { margin-left:auto; }
  #term { position:absolute; top:36px; left:0; right:0; bottom:0; padding:var(--space-2); }
  #term .xterm { padding:4px; }
</style>
</head>
<body>
<div id="bar">
  <div class="traffic" role="group" aria-label="Window controls">
    <button class="close" data-action="close" aria-label="Close window">×</button>
    <button class="min" data-action="minimize" aria-label="Minimize window">−</button>
    <button class="max" data-action="maximize" aria-label="Maximize window">+</button>
  </div>
  <strong>OpenCode</strong>
  <span class="sub">local PTY</span>
  <button id="update" aria-label="Check for updates">Updates</button>
  <span class="sub" id="update-status" role="status" aria-live="polite"></span>
  <button id="modelToggle" aria-label="Toggle local model panel">+ Model</button>
  <button id="dock" aria-label="Toggle terminal dock position">Dock: Left</button>
</div>
<div id="term"></div>
<script>
  function send(msg) { window.chrome.webview.postMessage(JSON.stringify(msg)); }
  window.__setDock = function (mode) {
    document.getElementById('dock').textContent =
      'Dock: ' + (mode === 'bottom' ? 'Bottom' : 'Left');
  };
  document.getElementById('dock').addEventListener('click', function () { send({ type: 'dock' }); });
  document.getElementById('modelToggle').addEventListener('click', function () { send({ type: 'model_toggle' }); });
  window.__setModelVisible = function (v) {
    document.getElementById('modelToggle').textContent = v ? '− Model' : '+ Model';
  };
  document.getElementById('update').addEventListener('click', function () { send({ type: 'update_check' }); });
  document.querySelectorAll('.traffic button').forEach(function (b) {
    b.addEventListener('click', function () { send({ type: 'window_action', action: b.dataset.action }); });
  });
  window.__setUpdateStatus = function (s) {
    document.getElementById('update-status').textContent = s;
  };
  window.onerror = function (m) { send({ type: 'jserror', message: String(m) }); };
</script>
<script src="xterm.min.js"></script>
<script src="addon-fit.min.js"></script>
<script>
  const term = new Terminal({
    fontFamily: '"SF Mono", "Cascadia Mono", Consolas, monospace',
    fontSize: 13, lineHeight: 1.3, cursorBlink: true,
    theme: {
      background: '#1e1e1e', foreground: '#f5f5f7', cursor: '#0a84ff',
      selectionBackground: 'rgba(10,132,255,0.28)',
      black: '#1e1e1e', brightBlack: '#98989d'
    }
  });
  term.open(document.getElementById('term'));
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  fitAddon.fit();
  term.focus();
  function sendSize() {
    send({ type: 'resize', cols: term.cols, rows: term.rows });
  }
  window.__fit = function () { fitAddon.fit(); sendSize(); };
  window.addEventListener('resize', function () { fitAddon.fit(); sendSize(); });
  term.onData(function (data) { send({ type: 'input', data: data }); });
  sendSize();
  send({ type: 'ready' });
  window.__termWrite = function (data) { term.write(data); };
</script>
</body>
</html>
