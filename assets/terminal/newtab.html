<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:radial-gradient(circle at 50% 35%, #16243d 0%, var(--bg) 62%);
         padding:var(--space-4); }
  .brand { color:var(--accent); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
           font-weight:600; margin-bottom:var(--space-4); }
  .search { width:min(560px, 90%); height:46px; display:flex; align-items:center; gap:var(--space-2);
            background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
            padding:0 var(--space-4); box-shadow:var(--shadow-panel); }
  .search:focus-within { border-color:var(--accent); }
  #q { flex:1; min-width:0; background:transparent; border:0; outline:0; color:var(--text);
       font-family:var(--sans); font-size:15px; }
  #q::placeholder { color:var(--muted); }
  .hint { color:var(--muted); font-size:11px; margin-top:var(--space-3); }
  .shortcuts { display:flex; gap:var(--space-2); margin-top:var(--space-4); flex-wrap:wrap;
               justify-content:center; }
  .chip { width:68px; height:64px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:6px; }

  .chip span { font-size:11px; color:var(--muted); }
  .chip b { font-size:15px; color:var(--text); }
</style>
</head>
<body>
<div class="brand">Agent Browser</div>
<div class="search">
  <span aria-hidden="true" style="color:var(--muted)">⌕</span>
  <input id="q" aria-label="Search or enter address" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
</div>
<div class="hint">Press Enter to open in this tab</div>
<div class="shortcuts">
  <button class="chip" data-url="https://www.google.com"><b>G</b><span>Google</span></button>
  <button class="chip" data-url="https://github.com"><b>GH</b><span>GitHub</span></button>
  <button class="chip" data-url="https://www.youtube.com"><b>YT</b><span>YouTube</span></button>
  <button class="chip" data-url="https://lexfridman.com"><b>LF</b><span>Lex</span></button>
</div>
<script>
  function go(url) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'navigate', url: url }));
  }
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { go(document.getElementById('q').value); }
  });
  document.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-url')); });
  });
</script>
</body>
</html>
