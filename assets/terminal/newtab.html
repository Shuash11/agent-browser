<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:radial-gradient(circle at 50% 32%, #16243d 0%, var(--bg) 62%);
         padding:var(--space-4); }
  .brand { color:var(--accent); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
           font-weight:600; margin-bottom:var(--space-2); }
  .sub { color:var(--muted); font-size:12px; margin-bottom:var(--space-4); }
  .shortcuts { display:grid; grid-template-columns:repeat(5, 92px); gap:var(--space-2);
               justify-content:center; max-width:100%; }
  .chip { width:92px; height:76px; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:6px; }
  .chip b { font-size:17px; font-weight:600; color:var(--text); }
  .chip span { font-size:11px; color:var(--muted); }
  .divider { width:min(520px, 90%); height:1px; background:var(--line); margin:var(--space-4) 0; }
  .download { min-width:240px; min-height:48px; padding:10px var(--space-4);
              border-color:var(--accent); color:var(--accent); display:flex;
              flex-direction:column; align-items:center; gap:2px; }
  .download b { font-size:13px; }
  .download small { font-size:10px; color:var(--muted); }
  @media (max-width:520px) {
    .shortcuts { grid-template-columns:repeat(3, 84px); }
    .chip { width:84px; height:70px; }
  }
</style>
</head>
<body>
<div class="brand">Agent Browser</div>
<div class="sub">Choose a destination, or use the address bar above</div>

<div class="shortcuts">
  <button class="chip" data-url="https://www.tiktok.com"><b>TT</b><span>TikTok</span></button>
  <button class="chip" data-url="https://www.youtube.com"><b>YT</b><span>YouTube</span></button>
  <button class="chip" data-url="https://www.facebook.com"><b>f</b><span>Facebook</span></button>
  <button class="chip" data-url="https://www.instagram.com"><b>IG</b><span>Instagram</span></button>
  <button class="chip" data-url="https://github.com"><b>GH</b><span>GitHub</span></button>
</div>

<div class="divider"></div>
<button class="download" data-url="https://www.youtube.com/premium">
  <b>Video downloads</b>
  <small>YouTube Premium — official</small>
</button>

<script>
  function go(url) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'navigate', url: url }));
  }
  document.querySelectorAll('[data-url]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-url')); });
  });
</script>
</body>
</html>
