<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height:100%; }
  body { background:var(--surface-solid); border-left:1px solid var(--line); overflow:hidden; }
  #head { height:36px; display:flex; align-items:center; padding:0 var(--space-3);
          border-bottom:1px solid var(--line); color:var(--muted); font-size:11px;
          text-transform:uppercase; letter-spacing:.08em; }
  #list { padding:var(--space-2); display:flex; flex-direction:column; gap:var(--space-1); }
  .tab { width:100%; min-height:44px; padding:6px var(--space-2); text-align:left;
         border:1px solid transparent; border-radius:var(--radius-sm); background:transparent;
         display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .tab:hover { background:rgba(255,255,255,.04); }
  .tab.active { border-color:var(--accent); background:var(--accent-soft); }
  .tab b { font-size:11px; color:var(--text); white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; font-weight:600; }
  .tab small { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; }
  #new { margin:var(--space-2); width:calc(100% - 24px); min-height:28px; font-size:12px; }
</style>
</head>
<body>
<div id="head">Tabs</div>
<div id="list"></div>
<button id="new" aria-label="Open a new tab">+ New tab</button>
<script>
  var list = document.getElementById('list');
  window.__setTabs = function (titles, urls, active) {
    list.innerHTML = '';
    titles.forEach(function (title, i) {
      var b = document.createElement('button');
      b.className = 'tab' + (i === active ? ' active' : '');
      b.setAttribute('aria-label', 'Tab ' + (i + 1) + ': ' + title);
      b.innerHTML = '<b></b><small></small>';
      b.querySelector('b').textContent = title || ('Tab ' + (i + 1));
      b.querySelector('small').textContent = urls[i] || '';
      b.addEventListener('click', function () {
        window.chrome.webview.postMessage(JSON.stringify({ type: 'focus', index: i }));
      });
      list.appendChild(b);
    });
  };
  document.getElementById('new').addEventListener('click', function () {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'newtab' }));
  });
</script>
</body>
</html>
