<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="icons.css">
<style>
  html, body { height:100%; }
  body { background:var(--surface-solid); border-left:1px solid var(--line); overflow:hidden; }
  #head { height:36px; display:flex; align-items:center; padding:0 var(--space-3);
          border-bottom:1px solid var(--line); color:var(--muted); font-size:11px;
          text-transform:uppercase; letter-spacing:.08em; }
  #list { padding:var(--space-2); display:flex; flex-direction:column; gap:var(--space-1); }
  .row { display:flex; gap:var(--space-1); width:100%; }
  .tab { flex:1; min-width:0; min-height:44px; padding:6px var(--space-2); text-align:left;
         border:1px solid transparent; border-radius:var(--radius-md); background:transparent;
         display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .tab:hover { background:var(--surface-raised); }
  .tab.active { border-color:var(--accent); background:var(--accent-soft); }
  .tab.closed { opacity:.45; }
  .tab b { font-size:11px; color:var(--text); white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; font-weight:600; }
  .tab small { font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; }
  .close { width:24px; min-height:44px; flex:none; padding:0; font-size:14px; border-radius:var(--radius-md); }
  #new { margin:var(--space-2); width:calc(100% - 24px); min-height:28px; font-size:12px;
         display:flex; align-items:center; justify-content:center; gap:var(--space-2); }
  .close .icon { width:12px; height:12px; }
</style>
</head>
<body>
<div id="head">Tabs</div>
<div id="list"></div>
<button id="new" aria-label="Open a new tab"><span class="icon i-plus"></span> New tab</button>
<script>
  var list = document.getElementById('list');
  function send(kind, index) {
    var msg = { type: kind };
    if (index !== undefined) msg.index = index;
    window.chrome.webview.postMessage(JSON.stringify(msg));
  }
  window.__setTabs = function (titles, urls, active, closed) {
    list.innerHTML = '';
    titles.forEach(function (title, i) {
      var row = document.createElement('div');
      row.className = 'row';
      var tab = document.createElement('button');
      tab.className = 'tab' + (i === active ? ' active' : '') + (closed[i] ? ' closed' : '');
      tab.setAttribute('aria-label', 'Tab ' + (i + 1) + ': ' + title);
      tab.innerHTML = '<b></b><small></small>';
      tab.querySelector('b').textContent = (closed[i] ? '↺ ' : '') + (title || ('Tab ' + (i + 1)));
      tab.querySelector('small').textContent = closed[i] ? 'closed — reopen' : (urls[i] || '');
      tab.addEventListener('click', function () { send(closed[i] ? 'reopen' : 'focus', i); });
      var close = document.createElement('button');
      close.className = 'close';
      close.innerHTML = closed[i] ? '·' : '<span class="icon i-x"></span>';
      close.setAttribute('aria-label', 'Close tab ' + (i + 1));
      close.disabled = !!closed[i];
      close.addEventListener('click', function (e) { e.stopPropagation(); send('close', i); });
      row.appendChild(tab);
      row.appendChild(close);
      list.appendChild(row);
    });
  };
  document.getElementById('new').addEventListener('click', function () { send('newtab'); });
</script>
</body>
</html>
